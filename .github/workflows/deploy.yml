name: Deploy to cPanel Web Disk

on:
  # No paths filter: GitHub's glob matching treats dotfiles inconsistently,
  # and .htaccess is a dotfile. The job itself exits cleanly when there is
  # nothing to publish, so filtering here buys nothing and can silently skip.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Upload every file, not just the ones that changed'
        type: boolean
        default: false

# Never let two deploys write to the server at the same time.
concurrency:
  group: deploy-webdisk
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the previous commit to diff against

      - name: Publish over WebDAV
        env:
          WEBDAV_HOST: ${{ secrets.WEBDAV_HOST }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
          FULL_SYNC: ${{ github.event.inputs.full_sync || 'false' }}
        run: |
          set -euo pipefail

          # Fail loudly on a missing secret. Without this, an unset value just
          # produces "curl: (3) No host part in the URL", which says nothing
          # about the actual cause.
          missing=0
          for v in WEBDAV_HOST WEBDAV_USER WEBDAV_PASS; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Repository secret $v is not set (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          SRC="Budget-Hardware-Website"
          BASE="https://${WEBDAV_HOST}:2078"

          # Credentials go in a curl config file rather than .netrc: netrc is
          # whitespace-delimited, so a password containing a space or '#'
          # silently parses wrong. A config file quotes the value properly and
          # still keeps it out of the process list.
          CFG="$(mktemp)"
          trap 'rm -f "$CFG"' EXIT
          printf 'user = "%s:%s"\n' "$WEBDAV_USER" "$WEBDAV_PASS" > "$CFG"
          chmod 600 "$CFG"

          CURL=(curl --config "$CFG" --silent --show-error --location)

          # Make sure the subdirectories exist. MKCOL returns 405 when the
          # collection is already there, which is fine.
          for dir in css js images; do
            "${CURL[@]}" -o /dev/null -w '' -X MKCOL "$BASE/$dir/" || true
          done

          upload() {
            local rel="$1" code
            # Capture the HTTP status so a failure says *why* (401 wrong
            # credentials, 403 permissions, 404 wrong path) instead of just
            # "failed".
            code=$("${CURL[@]}" -o /dev/null -w '%{http_code}' -T "$SRC/$rel" "$BASE/$rel" || echo 000)
            case "$code" in
              2*) echo "  uploaded  $rel  ($code)" ;;
              401) echo "  FAILED    $rel  (401 Unauthorized - check WEBDAV_USER / WEBDAV_PASS)" >&2; return 1 ;;
              403) echo "  FAILED    $rel  (403 Forbidden - Web Disk user lacks write permission)" >&2; return 1 ;;
              404) echo "  FAILED    $rel  (404 - path does not exist under the Web Disk home directory)" >&2; return 1 ;;
              000) echo "  FAILED    $rel  (could not connect to $WEBDAV_HOST:2078)" >&2; return 1 ;;
              *)   echo "  FAILED    $rel  (HTTP $code)" >&2; return 1 ;;
            esac
          }

          # Show where the Web Disk account actually rooted us. If this lists
          # 'public_html', the home directory is the account home, not
          # public_html, and every upload is landing one level too high.
          echo "Web Disk root contains:"
          "${CURL[@]}" -X PROPFIND -H 'Depth: 1' "$BASE/" 2>/dev/null \
            | grep -oE '<D:href>[^<]*</D:href>' | sed 's|</\?D:href>||g' | head -20 \
            || echo "  (could not list root)"

          remove() {
            local rel="$1"
            "${CURL[@]}" -o /dev/null -X DELETE "$BASE/$rel" || true
            echo "  deleted   $rel"
          }

          # Decide what to send.
          if [ "$FULL_SYNC" = "true" ] || ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "Full sync."
            mapfile -t CHANGED < <(cd "$SRC" && find . -type f ! -name '.DS_Store' | sed 's|^\./||')
            REMOVED=()
          else
            echo "Syncing files changed in ${GITHUB_SHA:0:7}."
            mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD -- "$SRC" | sed "s|^$SRC/||")
            mapfile -t REMOVED < <(git diff --name-only --diff-filter=D    HEAD~1 HEAD -- "$SRC" | sed "s|^$SRC/||")
          fi

          if [ "${#CHANGED[@]}" -eq 0 ] && [ "${#REMOVED[@]}" -eq 0 ]; then
            echo "Nothing to publish."
            exit 0
          fi

          FAILED=0
          for f in "${CHANGED[@]:-}"; do
            [ -n "$f" ] || continue
            upload "$f" || FAILED=1
          done
          for f in "${REMOVED[@]:-}"; do
            [ -n "$f" ] || continue
            remove "$f"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more uploads failed." >&2
            exit 1
          fi
          echo "Done."

      - name: Verify the site is serving
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 "https://${{ secrets.SITE_URL }}/" || echo 000)
          echo "Homepage returned HTTP $code"
          [ "$code" = "200" ] || { echo "Site is not returning 200." >&2; exit 1; }
